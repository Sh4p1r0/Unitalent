        <span>Dashboard</span>
      </div>
      <div class="nav-item" onclick="location.href='ofertas.html'">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span>Buscar ofertas</span>

      <div class="nav-item active" onclick="location.href='postulaciones.html'">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        <span>Mis postulaciones</span>
      </div>
      <div class="nav-item" onclick="location.href='perfil.html'">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Mi perfil</span>
      </div>
    </div>
    
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar" data-user-initial>?</div>
        <div>
          <div style="font-weight:600;" data-user-name>Cargando...</div>
          <div style="font-size: var(--text-micro); color: var(--color-steel);">Estudiante</div>
        </div>
      </div>
      <button onclick="logout()" class="btn btn-outline btn-block btn-sm">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        <span>Cerrar sesion</span>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>Mis postulaciones</h1>
        <p>Seguimiento y estado de tus postulaciones laborales activas.</p>
      </div>
    </div>

    <div class="panel">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Oferta</th>
              <th>Empresa</th>
              <th>Fecha de postulacion</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tabla">
            <tr><td colspan="4" style="color: var(--color-steel);">Cargando postulaciones...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script>
async function cargar() {
  try {
    const postulaciones = await Api.get('/UniTalent/api/postulaciones');
    const tbody = document.getElementById('tabla');

    if (postulaciones.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: var(--spacing-xxl); color: var(--color-steel);">Aun no te has postulado a ninguna vacante. <a href="ofertas.html" style="color: var(--color-brand-green-deep); font-weight: 500; text-decoration: underline;">Explora ofertas aqui</a>.</td></tr>';
      return;
    }

    tbody.innerHTML = postulaciones.map(p => `
      <tr>
        <td><strong style="color: var(--color-ink);">${escapeHtml(p.tituloOferta)}</strong></td>
        <td style="color: var(--color-steel);">${escapeHtml(p.nombreEmpresa)}</td>
        <td style="font-family: var(--font-family-2); font-size: var(--text-code-sm); color: var(--color-steel);">${escapeHtml(p.fechaPostulacion)}</td>
        <td><span class="badge ${badgeClass(p.estado)}">${escapeHtml(p.estado)}</span></td>
      </tr>
    `).join('');
  } catch (e) {
    console.error(e);
  }
}

(async () => {
  const session = await requireSession('ESTUDIANTE');
  if (!session) return;
  await cargar();
  setInterval(cargar, 15000);
})();

function badgeClass(estado) {
  if (estado === 'Aceptada') return 'aceptada';
  if (estado === 'Rechazada') return 'rechazada';
  if (estado === 'En Proceso') return 'proceso';
  return 'enviada';
}
</script>
</body>
</html>
