<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis ofertas | UniTalent</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="mobile-topbar">
  <div class="logo" style="margin-bottom:0;"><span class="logo-icon">U</span> UniTalent</div>
  <button class="menu-toggle" id="mobile-menu-toggle" aria-label="Abrir menu">
    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
  </button>
</div>

<div class="app-layout">

  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <span class="logo-icon">U</span>
      <span>UniTalent</span>
    </div>

    <div class="sidebar-section-header">Empresa</div>
    <div class="nav-menu">
      <div class="nav-item" onclick="location.href='dashboard.html'">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Dashboard</span>
      </div>
      <div class="nav-item active" onclick="location.href='ofertas.html'">
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
        <span>Mis ofertas</span>
      </div>
      <div class="nav-item" onclick="location.href='postulantes.html'">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span>Postulantes</span>
      </div>
      <div class="nav-item" onclick="location.href='perfil.html'">
        <svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="9" y1="22" x2="9" y2="22.01"></line><line x1="15" y1="22" x2="15" y2="22.01"></line><line x1="9" y1="18" x2="9" y2="18.01"></line><line x1="15" y1="18" x2="15" y2="18.01"></line><line x1="9" y1="14" x2="9" y2="14.01"></line><line x1="15" y1="14" x2="15" y2="14.01"></line><line x1="9" y1="10" x2="9" y2="10.01"></line><line x1="15" y1="10" x2="15" y2="10.01"></line><line x1="9" y1="6" x2="9" y2="6.01"></line><line x1="15" y1="6" x2="15" y2="6.01"></line></svg>
        <span>Perfil corporativo</span>
      </div>
    </div>
    
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar" data-user-initial>?</div>
        <div>
          <div style="font-weight:600;" data-user-name>Cargando...</div>
          <div style="font-size: var(--text-micro); color: var(--color-steel);">Empresa aliada</div>
        </div>
      </div>
      <button onclick="logout()" class="btn btn-outline btn-block btn-sm">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        <span>Cerrar sesion</span>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>Mis ofertas laborales</h1>
        <p>Publica convocatorias, gestiona vacantes activas y revisa postulantes.</p>
      </div>
      <button class="btn btn-primary" onclick="abrirModal()">Nueva oferta</button>
    </div>

    <div class="job-grid" id="jobList">
      <div class="empty-state">Cargando ofertas publicadas...</div>
    </div>
  </main>
</div>

<!-- Modal crear/editar oferta -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitulo">Nueva oferta</h3>
      <button type="button" class="modal-close" onclick="cerrarModal()">&times;</button>
    </div>
    <form id="ofertaForm">
      <input type="hidden" id="idOferta">
      <div class="field">
        <label for="titulo">Titulo del puesto</label>
        <input type="text" id="titulo" required placeholder="Ej. Desarrollador Frontend Jr.">
      </div>
      <div class="field">
        <label for="descripcion">Descripcion del puesto</label>
        <textarea id="descripcion" rows="3" placeholder="Responsabilidades, requisitos y perfil profesional esperado..."></textarea>
      </div>
      <div class="field-row">
        <div class="field" style="flex: 1;">
          <label for="carrera">Carrera solicitada</label>
          <input type="text" id="carrera" placeholder="Ej. Ingenieria de Sistemas">
        </div>
        <div class="field" style="width: 150px;">
          <label for="modalidad">Modalidad</label>
          <select id="modalidad">
            <option value="Presencial">Presencial</option>
            <option value="Remoto">Remoto</option>
            <option value="Hibrido">Hibrido</option>
          </select>
        </div>
      </div>
      <div class="field" id="campoEstado" style="display:none;">
        <label for="estado">Estado de la convocatoria</label>
        <select id="estado">
          <option value="Activa">Activa</option>
          <option value="Cerrada">Cerrada</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top: var(--spacing-md);">Guardar oferta</button>
    </form>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script>
let ofertas = [];

async function cargarOfertas() {
  ofertas = await Api.get('/UniTalent/api/ofertas');
  const list = document.getElementById('jobList');

  if (ofertas.length === 0) {
    list.innerHTML = '<div class="empty-state">Aun no has publicado ofertas. Crea tu primera convocatoria con el boton "Nueva oferta".</div>';
    return;
  }

  list.innerHTML = ofertas.map(o => `
    <div class="job-card">
      <h3>${escapeHtml(o.titulo)}</h3>
      <div class="company">Publicado ${escapeHtml(o.fechaPublicacion)} · ${o.totalPostulantes} postulante(s)</div>
      <div class="desc">${escapeHtml(o.descripcion || 'Sin descripcion adicional.')}</div>
      <div class="tags">
        ${o.carrera ? `<span class="tag">${escapeHtml(o.carrera)}</span>` : ''}
        ${o.modalidad ? `<span class="tag">${escapeHtml(o.modalidad)}</span>` : ''}
        <span class="badge ${o.estado === 'Activa' ? 'activa' : 'cerrada'}">${escapeHtml(o.estado)}</span>
      </div>
      <div class="actions">
        <button class="btn btn-outline btn-sm" onclick="editarOferta(${o.idOferta})">Editar</button>
        <button class="btn btn-outline btn-sm" onclick="location.href='postulantes.html?idOferta=${o.idOferta}'">Postulantes</button>
        <button class="btn btn-danger btn-sm" onclick="eliminarOferta(${o.idOferta})">Eliminar</button>
      </div>
    </div>
  `).join('');
}

function abrirModal() {
  document.getElementById('modalTitulo').textContent = 'Nueva oferta';
  document.getElementById('ofertaForm').reset();
  document.getElementById('idOferta').value = '';
  document.getElementById('campoEstado').style.display = 'none';
  document.getElementById('modal').classList.add('open');
}

function editarOferta(id) {
  const o = ofertas.find(x => x.idOferta === id);
  if (!o) return;
  document.getElementById('modalTitulo').textContent = 'Editar oferta';
  document.getElementById('idOferta').value = o.idOferta;
  document.getElementById('titulo').value = o.titulo || '';
  document.getElementById('descripcion').value = o.descripcion || '';
  document.getElementById('carrera').value = o.carrera || '';
  document.getElementById('modalidad').value = o.modalidad || 'Presencial';
  document.getElementById('estado').value = o.estado || 'Activa';
  document.getElementById('campoEstado').style.display = 'block';
  document.getElementById('modal').classList.add('open');
}

function cerrarModal() {
  document.getElementById('modal').classList.remove('open');
}

async function eliminarOferta(id) {
  if (!confirm('Deseas eliminar esta oferta? Esta accion no se puede deshacer.')) return;
  try {
    await Api.del('/UniTalent/api/ofertas?id=' + id);
    showToast('Oferta eliminada correctamente', 'success');
    cargarOfertas();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

document.getElementById('ofertaForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const idOferta = document.getElementById('idOferta').value;
  const payload = {
    titulo: document.getElementById('titulo').value.trim(),
    descripcion: document.getElementById('descripcion').value.trim(),
    carrera: document.getElementById('carrera').value.trim(),
    modalidad: document.getElementById('modalidad').value
  };

  try {
    if (idOferta) {
      payload.idOferta = idOferta;
      payload.estado = document.getElementById('estado').value;
      await Api.put('/UniTalent/api/ofertas', payload);
      showToast('Oferta actualizada correctamente', 'success');
    } else {
      await Api.post('/UniTalent/api/ofertas', payload);
      showToast('Oferta publicada correctamente', 'success');
    }
    cerrarModal();
    cargarOfertas();
  } catch (err) {
    showToast(err.message, 'error');
  }
});

(async () => {
  const session = await requireSession('EMPRESA');
  if (!session) return;
  await cargarOfertas();
  setInterval(cargarOfertas, 15000);
})();
</script>
</body>
</html>
