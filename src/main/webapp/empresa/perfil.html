<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil de empresa | UniTalent</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="mobile-topbar">
  <div class="logo" style="margin-bottom:0;"><span class="logo-icon">U</span> UniTalent</div>
  <button class="menu-toggle" id="mobile-menu-toggle" aria-label="Abrir menu">
    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
  </button>
</div>

<div class="app-layout">

  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <span class="logo-icon">U</span>
      <span>UniTalent</span>
    </div>

    <div class="sidebar-section-header">Empresa</div>
    <div class="nav-menu">
      <div class="nav-item" onclick="location.href='dashboard.html'">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Dashboard</span>
      </div>
      <div class="nav-item" onclick="location.href='ofertas.html'">
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
        <span>Mis ofertas</span>
      </div>
      <div class="nav-item" onclick="location.href='postulantes.html'">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span>Postulantes</span>
      </div>
      <div class="nav-item active" onclick="location.href='perfil.html'">
        <svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="9" y1="22" x2="9" y2="22.01"></line><line x1="15" y1="22" x2="15" y2="22.01"></line><line x1="9" y1="18" x2="9" y2="18.01"></line><line x1="15" y1="18" x2="15" y2="18.01"></line><line x1="9" y1="14" x2="9" y2="14.01"></line><line x1="15" y1="14" x2="15" y2="14.01"></line><line x1="9" y1="10" x2="9" y2="10.01"></line><line x1="15" y1="10" x2="15" y2="10.01"></line><line x1="9" y1="6" x2="9" y2="6.01"></line><line x1="15" y1="6" x2="15" y2="6.01"></line></svg>
        <span>Perfil corporativo</span>
      </div>
    </div>
    
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar" data-user-initial>?</div>
        <div>
          <div style="font-weight:600;" data-user-name>Cargando...</div>
          <div style="font-size: var(--text-micro); color: var(--color-steel);">Empresa aliada</div>
        </div>
      </div>
      <button onclick="logout()" class="btn btn-outline btn-block btn-sm">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        <span>Cerrar sesion</span>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>Perfil de la empresa</h1>
        <p>Datos corporativos visibles para los postulantes en la red de UniTalent.</p>
      </div>
    </div>

    <div class="panel" style="max-width: 580px;">
      <form id="perfilForm">
        <div class="field">
          <label for="nombre">Representante legal</label>
          <input type="text" id="nombre" disabled style="background-color: var(--color-surface-soft); color: var(--color-steel);">
        </div>

        <div class="field">
          <label for="correo">Correo corporativo</label>
          <input type="email" id="correo" disabled style="background-color: var(--color-surface-soft); color: var(--color-steel);">
        </div>

        <div class="field">
          <label for="nombreEmpresa">Razon social o nombre comercial</label>
          <input type="text" id="nombreEmpresa" required placeholder="Ej. TechNova Solutions SAC">
        </div>

        <div class="field">
          <label for="rubro">Rubro o industria</label>
          <input type="text" id="rubro" placeholder="Ej. Desarrollo de Software y Servicios Cloud">
        </div>

        <div class="field">
          <label for="descripcion">Descripcion o presentacion de la organizacion</label>
          <textarea id="descripcion" rows="4" placeholder="Breve introduccion de proyectos, cultura y tecnologias usadas..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: var(--spacing-sm);">Guardar perfil</button>
      </form>
    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script src="../js/app.js"></script>
<script>
(async () => {
  const session = await requireSession('EMPRESA');
  if (!session) return;

  const perfil = await Api.get('/UniTalent/api/perfil');
  document.getElementById('nombre').value = perfil.nombre || '';
  document.getElementById('correo').value = perfil.correo || '';
  document.getElementById('nombreEmpresa').value = perfil.nombreEmpresa || '';
  document.getElementById('rubro').value = perfil.rubro || '';
  document.getElementById('descripcion').value = perfil.descripcion || '';
})();

document.getElementById('perfilForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await Api.put('/UniTalent/api/perfil', {
      nombreEmpresa: document.getElementById('nombreEmpresa').value.trim(),
      rubro: document.getElementById('rubro').value.trim(),
      descripcion: document.getElementById('descripcion').value.trim()
    });
    showToast('Perfil de empresa actualizado correctamente', 'success');
  } catch (err) {
    showToast(err.message, 'error');
  }
});
</script>
</body>
</html>
